# Temporary diagnostic: is api.open-meteo.com usable from a GitHub runner?
# Delete once the question is settled.
name: diag-openmeteo

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Open-Meteo
        run: |
          set -uo pipefail
          echo "runner egress IP: $(curl -s --max-time 20 https://api.ipify.org || echo unknown)"
          echo

          probe () {
            local label="$1" url="$2"
            for i in 1 2 3; do
              out=$(curl -s -o /tmp/body -w '%{http_code} %{time_total}s %{size_download}B' \
                    --max-time 45 "$url" 2>&1) || out="CURL_FAIL($?)"
              echo "$label attempt $i -> $out"
              head -c 160 /tmp/body 2>/dev/null; echo
              sleep 3
            done
          }

          probe "single-point" \
            "https://api.open-meteo.com/v1/forecast?latitude=13.75&longitude=100.5&hourly=temperature_2m&models=ecmwf_ifs&past_days=2&forecast_days=1&timezone=Asia%2FBangkok"

          # 50 coordinates, the same batch shape the predict job uses
          LATS=$(python3 -c "print(','.join(['13.75']*50))")
          LONS=$(python3 -c "print(','.join(['100.5']*50))")
          probe "50-point-batch" \
            "https://api.open-meteo.com/v1/forecast?latitude=${LATS}&longitude=${LONS}&hourly=temperature_2m,relative_humidity_2m,pressure_msl,surface_pressure,dew_point_2m,precipitation,cloud_cover,wind_speed_10m,wind_direction_10m&models=ecmwf_ifs&past_days=2&forecast_days=1&timezone=Asia%2FBangkok"
